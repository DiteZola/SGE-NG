<!DOCTYPE html>
<html lang="pt-AO" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="SGE-NG - Sistema de Gestão Escolar de Nova Geração">
    <meta name="theme-color" content="#2563EB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <title>SGE-NG - Sistema de Gestão Escolar</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe',
                            300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6',
                            600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af',
                            900: '#1e3a8a'
                        },
                        success: {
                            50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0',
                            300: '#86efac', 400: '#4ade80', 500: '#22c55e',
                            600: '#16a34a', 700: '#15803d', 800: '#166534',
                            900: '#14532d'
                        },
                        danger: {
                            50: '#fef2f2', 100: '#fee2e2', 200: '#fecaca',
                            300: '#fca5a5', 400: '#f87171', 500: '#ef4444',
                            600: '#dc2626', 700: '#b91c1c', 800: '#991b1b',
                            900: '#7f1d1d'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    
    <!-- SheetJS para exportação Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- jsPDF para geração de PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Estilos customizados -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-full bg-white text-gray-900 antialiased">
    
    <!-- ============================================= -->
    <!-- ECRÃ DE CARREGAMENTO INICIAL                  -->
    <!-- ============================================= -->
    <div id="loading-screen" class="fixed inset-0 z-[9999] flex items-center justify-center bg-white">
        <div class="text-center">
            <div class="relative mb-6">
                <div class="w-16 h-16 border-4 border-primary-200 border-t-primary-600 rounded-full animate-spin mx-auto"></div>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">SGE-NG</h1>
            <p class="text-gray-500 text-sm" id="loading-status">A inicializar o sistema...</p>
            <div class="mt-4 w-64 mx-auto bg-gray-200 rounded-full h-1.5">
                <div id="loading-progress" class="bg-primary-600 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- INDICADOR DE ESTADO DE CONEXÃO                -->
    <!-- ============================================= -->
    <div id="connection-bar" class="fixed top-0 left-0 right-0 z-[9998] hidden">
        <div class="px-4 py-2 text-center text-sm font-medium transition-all duration-300">
            <span id="connection-text"></span>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- CONTENTOR PRINCIPAL DA APLICAÇÃO               -->
    <!-- ============================================= -->
    <div id="app-container" class="hidden h-full">
        
        <!-- SIDEBAR / MENU LATERAL -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r border-gray-200 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col">
            
            <!-- Cabeçalho do Sidebar -->
            <div class="flex items-center justify-between h-16 px-4 border-b border-gray-200 flex-shrink-0">
                <div class="flex items-center space-x-3">
                    <div id="school-logo-sidebar" class="w-10 h-10 rounded-lg bg-primary-100 flex items-center justify-center">
                        <svg class="w-6 h-6 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                        </svg>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h2 class="text-sm font-bold text-gray-900 truncate" id="school-name-sidebar">SGE-NG</h2>
                        <p class="text-xs text-gray-500 truncate" id="school-year-sidebar">---</p>
                    </div>
                </div>
                <button id="sidebar-close-btn" class="lg:hidden p-1 rounded-md hover:bg-gray-100">
                    <svg class="w-5 h-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            
            <!-- Navegação do Menu -->
            <nav id="sidebar-nav" class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
                <!-- Preenchido dinamicamente por sidebar.js -->
            </nav>
            
            <!-- Rodapé do Sidebar - Perfil do Utilizador -->
            <div class="flex-shrink-0 border-t border-gray-200 p-4">
                <div class="flex items-center space-x-3">
                    <div id="user-avatar-sidebar" class="w-9 h-9 rounded-full bg-primary-100 flex items-center justify-center text-primary-700 font-semibold text-sm">
                        --
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-gray-900 truncate" id="user-name-sidebar">---</p>
                        <p class="text-xs text-gray-500 truncate" id="user-role-sidebar">---</p>
                    </div>
                    <button id="btn-logout" class="p-1.5 rounded-md hover:bg-red-50 text-gray-400 hover:text-red-600 transition-colors" title="Sair">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                    </button>
                </div>
                <!-- Indicador de Sincronização -->
                <div class="mt-3 flex items-center space-x-2 text-xs">
                    <div id="sync-indicator" class="w-2 h-2 rounded-full bg-green-500"></div>
                    <span id="sync-status-text" class="text-gray-500">Sincronizado</span>
                </div>
            </div>
        </aside>
        
        <!-- OVERLAY DO SIDEBAR (Mobile) -->
        <div id="sidebar-overlay" class="fixed inset-0 z-40 bg-gray-600 bg-opacity-50 hidden lg:hidden"></div>
        
        <!-- ÁREA DE CONTEÚDO PRINCIPAL -->
        <div class="lg:pl-64 flex flex-col h-full">
            
            <!-- HEADER SUPERIOR -->
            <header class="sticky top-0 z-30 bg-white border-b border-gray-200 h-16 flex items-center justify-between px-4 lg:px-6 flex-shrink-0">
                
                <!-- Botão Hamburger (Mobile) -->
                <button id="sidebar-toggle-btn" class="lg:hidden p-2 rounded-md hover:bg-gray-100">
                    <svg class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                
                <!-- Título da Página Atual -->
                <div class="flex-1 flex items-center ml-4 lg:ml-0">
                    <h1 id="page-title" class="text-lg font-semibold text-gray-900">Painel de Controlo</h1>
                    <nav id="breadcrumbs" class="hidden md:flex items-center ml-4 text-sm text-gray-500">
                        <!-- Breadcrumbs dinâmicos -->
                    </nav>
                </div>
                
                <!-- Ações do Header -->
                <div class="flex items-center space-x-3">
                    <!-- Indicador Online/Offline -->
                    <div id="online-indicator" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-green-50 text-green-700">
                        <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
                        <span>Online</span>
                    </div>
                    
                    <!-- Notificações -->
                    <button id="btn-notifications" class="relative p-2 rounded-md hover:bg-gray-100">
                        <svg class="w-5 h-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                        </svg>
                        <span id="notification-badge" class="absolute -top-0.5 -right-0.5 w-4 h-4 bg-red-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center hidden">0</span>
                    </button>
                    
                    <!-- Perfil -->
                    <button id="btn-user-menu" class="flex items-center space-x-2 p-1.5 rounded-md hover:bg-gray-100">
                        <div id="user-avatar-header" class="w-8 h-8 rounded-full bg-primary-100 flex items-center justify-center text-primary-700 font-semibold text-xs">
                            --
                        </div>
                    </button>
                </div>
            </header>
            
            <!-- CONTEÚDO DINÂMICO DAS PÁGINAS -->
            <main id="main-content" class="flex-1 overflow-y-auto p-4 lg:p-6 bg-gray-50">
                <!-- Conteúdo renderizado dinamicamente pelo router -->
            </main>
            
            <!-- RODAPÉ -->
            <footer class="flex-shrink-0 border-t border-gray-200 bg-white px-4 py-2 text-center text-xs text-gray-400">
                SGE-NG &copy; <span id="footer-year">2025</span> — Sistema de Gestão Escolar de Nova Geração
            </footer>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- ECRÃ DE LOGIN                                 -->
    <!-- ============================================= -->
    <div id="login-screen" class="hidden fixed inset-0 z-[9000] bg-white flex items-center justify-center">
        <div class="w-full max-w-md px-6">
            <div class="text-center mb-8">
                <div class="w-20 h-20 mx-auto rounded-2xl bg-primary-100 flex items-center justify-center mb-4">
                    <svg class="w-10 h-10 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">SGE-NG</h1>
                <p class="text-gray-500 text-sm mt-1">Sistema de Gestão Escolar</p>
            </div>
            
            <form id="login-form" class="space-y-4" novalidate>
                <div>
                    <label for="login-email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="login-email" name="email" required
                        class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg focus:border-primary-600 focus:ring-0 outline-none transition-colors text-sm"
                        placeholder="seu.email@escola.ao">
                </div>
                <div>
                    <label for="login-password" class="block text-sm font-medium text-gray-700 mb-1">Palavra-passe</label>
                    <div class="relative">
                        <input type="password" id="login-password" name="password" required
                            class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg focus:border-primary-600 focus:ring-0 outline-none transition-colors text-sm"
                            placeholder="••••••••">
                        <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="login-error" class="hidden p-3 bg-danger-50 border border-danger-200 rounded-lg text-danger-700 text-sm"></div>
                <button type="submit" id="login-submit-btn"
                    class="w-full py-2.5 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-lg transition-colors text-sm flex items-center justify-center space-x-2">
                    <span>Entrar</span>
                </button>
            </form>
            
            <!-- Consulta Pública para Pais -->
            <div class="mt-6 pt-6 border-t border-gray-200 text-center">
                <p class="text-sm text-gray-500 mb-3">Encarregado de Educação?</p>
                <button id="btn-parent-lookup" class="w-full py-2.5 border-2 border-success-600 text-success-700 hover:bg-success-50 font-medium rounded-lg transition-colors text-sm">
                    Consultar Situação do Aluno
                </button>
            </div>
            
            <p class="mt-6 text-center text-xs text-gray-400" id="login-offline-note"></p>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- ECRÃ DE CONFIGURAÇÃO INICIAL (Setup Wizard)   -->
    <!-- ============================================= -->
    <div id="setup-screen" class="hidden fixed inset-0 z-[9500] bg-white overflow-y-auto">
        <div id="setup-wizard-container" class="max-w-2xl mx-auto px-6 py-12">
            <!-- Preenchido por setup-wizard.js -->
        </div>
    </div>

    <!-- ============================================= -->
    <!-- MODAL DE CONSULTA PÚBLICA (Pais)              -->
    <!-- ============================================= -->
    <div id="parent-lookup-modal" class="hidden fixed inset-0 z-[9100] bg-gray-600 bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-lg font-bold text-gray-900">Consulta do Encarregado</h2>
                <button id="close-parent-lookup" class="p-1 rounded-md hover:bg-gray-100">
                    <svg class="w-5 h-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Código do Aluno</label>
                    <input type="text" id="parent-student-code"
                        class="w-full px-4 py-2.5 border-2 border-gray-300 rounded-lg focus:border-primary-600 focus:ring-0 outline-none transition-colors text-sm"
                        placeholder="Digite o código do aluno">
                </div>
                <button id="btn-search-student" class="w-full py-2.5 bg-success-600 hover:bg-success-700 text-white font-medium rounded-lg transition-colors text-sm">
                    Pesquisar
                </button>
                <div id="parent-lookup-result" class="hidden"></div>
            </div>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- CONTENTOR DE NOTIFICAÇÕES TOAST               -->
    <!-- ============================================= -->
    <div id="toast-container" class="fixed top-4 right-4 z-[10000] space-y-2 max-w-sm w-full pointer-events-none">
        <!-- Toasts inseridos dinamicamente -->
    </div>

    <!-- ============================================= -->
    <!-- MODAL GENÉRICO REUTILIZÁVEL                   -->
    <!-- ============================================= -->
    <div id="generic-modal" class="hidden fixed inset-0 z-[8000] bg-gray-600 bg-opacity-50 flex items-center justify-center p-4">
        <div id="generic-modal-content" class="bg-white rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
            <!-- Conteúdo dinâmico -->
        </div>
    </div>

    <!-- ============================================= -->
    <!-- MODAL DE CONFIRMAÇÃO                          -->
    <!-- ============================================= -->
    <div id="confirm-modal" class="hidden fixed inset-0 z-[8500] bg-gray-600 bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 text-center">
            <div id="confirm-icon" class="w-12 h-12 mx-auto rounded-full flex items-center justify-center mb-4"></div>
            <h3 id="confirm-title" class="text-lg font-bold text-gray-900 mb-2"></h3>
            <p id="confirm-message" class="text-sm text-gray-600 mb-6"></p>
            <div class="flex space-x-3">
                <button id="confirm-cancel" class="flex-1 py-2.5 border-2 border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors text-sm font-medium">
                    Cancelar
                </button>
                <button id="confirm-accept" class="flex-1 py-2.5 rounded-lg text-white text-sm font-medium transition-colors">
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <!-- ============================================= -->
    <!-- SCRIPTS DO SISTEMA (Ordem de carregamento)    -->
    <!-- ============================================= -->
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
    
    <!-- Core do Sistema (carregar nesta ordem) -->
    <script src="js/core/utils.js"></script>
    <script src="js/core/crypto.js"></script>
    <script src="js/core/firebase-config.js"></script>
    <script src="js/core/db-service.js"></script>
    <script src="js/core/sync-service.js"></script>
    <script src="js/core/security-engine.js"></script>
    <script src="js/core/recovery-engine.js"></script>
    <script src="js/core/auth-service.js"></script>
    <script src="js/core/router.js"></script>
    
    <!-- UI Components -->
    <script src="js/ui/components.js"></script>
    <script src="js/ui/sidebar.js"></script>
    <script src="js/ui/notifications.js"></script>
    <script src="js/ui/charts.js"></script>
    
    <!-- Módulos -->
    <script src="js/modules/setup-wizard.js"></script>
    <script src="js/modules/dashboard.js"></script>
    
    <!-- Módulos Académicos -->
    <script src="js/modules/academic/school-year.js"></script>
    <script src="js/modules/academic/classes.js"></script>
    <script src="js/modules/academic/sections.js"></script>
    <script src="js/modules/academic/shifts.js"></script>
    <script src="js/modules/academic/subjects.js"></script>
    <script src="js/modules/academic/assignments.js"></script>
    
    <!-- Módulos de Gestão -->
    <script src="js/modules/management/students.js"></script>
    <script src="js/modules/management/staff.js"></script>
    <script src="js/modules/management/grades.js"></script>
    <script src="js/modules/management/grade-engine.js"></script>
    <script src="js/modules/management/transcripts.js"></script>
    <script src="js/modules/management/attendance.js"></script>
    <script src="js/modules/management/history.js"></script>
    <script src="js/modules/management/jury.js"></script>
    
    <!-- Módulos de Documentos -->
    <script src="js/modules/documents/report-cards.js"></script>
    <script src="js/modules/documents/declarations.js"></script>
    <script src="js/modules/documents/certificates.js"></script>
    <script src="js/modules/documents/school-passes.js"></script>
    <script src="js/modules/documents/print-engine.js"></script>
    
    <!-- Módulos Financeiros -->
    <script src="js/modules/financial/fin-config.js"></script>
    <script src="js/modules/financial/payments.js"></script>
    <script src="js/modules/financial/cashflow.js"></script>
    
    <!-- Outros Módulos -->
    <script src="js/modules/other/statistics.js"></script>
    <script src="js/modules/other/reports.js"></script>
    <script src="js/modules/other/patrimony.js"></script>
    <script src="js/modules/other/messages.js"></script>
    <script src="js/modules/other/events.js"></script>
    <script src="js/modules/other/library.js"></script>
    
    <!-- Módulos do Sistema -->
    <script src="js/modules/system/schools.js"></script>
    <script src="js/modules/system/backup.js"></script>
    <script src="js/modules/system/settings.js"></script>
    <script src="js/modules/system/audit-logs.js"></script>
    <script src="js/modules/system/users.js"></script>
    <script src="js/modules/system/utilities.js"></script>
    
    <!-- Inicializador Principal (DEVE ser o último) -->
    <script src="js/core/app.js"></script>
</body>
</html>
